<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importar Extrato — Recebimentos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#132440; --navy2:#1c3358; --gold:#c9a227;
    --bg:#f4f5f7; --card:#fff; --line:#e2e5eb; --text:#1c2430; --muted:#6b7280;
    --green:#1f8a5f; --green-bg:#e7f6ee;
    --amber:#b5790a; --amber-bg:#fdf1dc;
    --red:#c23b3b; --red-bg:#fbe9e9;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;font-size:13.5px;}
  header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:16px 24px;border-bottom:3px solid var(--gold);}
  header h1{margin:0;font-size:17px;}
  header p{margin:4px 0 0 0;color:#c7d0de;font-size:12px;}
  main{max-width:1150px;margin:0 auto;padding:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px;}
  .card h2{margin:0 0 4px 0;font-size:14px;}
  .sub{color:var(--muted);font-size:12px;margin-bottom:12px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  button.btn{background:var(--navy);color:#fff;border:none;padding:8px 15px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600;}
  button.btn:hover{background:var(--navy2);}
  button.btn.gold{background:var(--gold);color:var(--navy);}
  button.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}
  input[type=text],input[type=password],input[type=number],select{padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:7px 8px;border-bottom:2px solid var(--line);}
  td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:hover td{background:#fafbfc;}
  .tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:700;}
  .tag.ok{background:var(--green-bg);color:var(--green);}
  .tag.warn{background:var(--amber-bg);color:var(--amber);}
  .tag.bad{background:var(--red-bg);color:var(--red);}
  .tag.skip{background:#eef1f6;color:var(--muted);}
  .locked-box{max-width:340px;margin:60px auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:30px 24px;}
  .locked-box input{width:100%;margin-bottom:10px;}
  .empty{padding:24px;text-align:center;color:var(--muted);}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:99;opacity:0;transition:opacity .25s;}
  .toast.show{opacity:1;}
  .fb-dot{width:8px;height:8px;border-radius:50%;background:#999;display:inline-block;margin-right:5px;}
  .fb-dot.ok{background:#3ecf7a;}
  .fb-dot.err{background:#e05555;}
  .month-badge{display:inline-block;background:#eef1f6;border-radius:5px;padding:2px 7px;font-size:11px;margin:1px 2px;font-weight:600;}
  .month-badge.conflict{background:var(--red-bg);color:var(--red);}
</style>
</head>
<body>

<header>
  <h1>Importar Extrato — Dar Baixa de Recebimentos</h1>
  <p><span class="fb-dot" id="fbDot"></span><span id="fbLabel">Firebase…</span> · Escreve diretamente no módulo Recebimentos existente</p>
</header>

<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
/* ================= FIREBASE (mesma base do index.html) ================= */
const FIREBASE_URL = 'https://dafilgest-interno-default-rtdb.europe-west1.firebasedatabase.app';
const FB = '/dafilgest';
const FB_SECRET = 'NLehfqIr5GqKyyKaIGg8YPSloZVo3qrrxcgboG2x';
const PASS_ADMIN = 'Dafilgest2026!';
const ANOS = ['2024','2025','2026','2027','2028','2029','2030'];
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function safeKey(nome){
  if(!nome) return nome;
  return nome.replace(/\.|\//g,'_').replace(/#/g,'_').replace(/\$/g,'_').replace(/\[/g,'_').replace(/\]/g,'_');
}
async function fbGet(p){
  try{const r=await fetch(FIREBASE_URL+FB+p+'.json?auth='+FB_SECRET,{cache:'no-store'});if(!r.ok)throw 0;return await r.json();}catch{return null;}
}
async function fbSet(p,data){
  try{
    const r=await fetch(FIREBASE_URL+FB+p+'.json?auth='+FB_SECRET,{method:'PUT',body:JSON.stringify(data),headers:{'Content-Type':'application/json'}});
    if(!r.ok)throw 0; setFB(true); return true;
  }catch{ setFB(false); return false; }
}
function setFB(ok){
  const d=document.getElementById('fbDot'), l=document.getElementById('fbLabel');
  if(d){d.className='fb-dot '+(ok?'ok':'err');}
  if(l){l.textContent=ok?'Online':'Sem ligação';}
}

/* ================= ESTADO ================= */
let unlocked=false;
let clientes=[];         // [{nome, avenca}]
let rec={};               // rec[ano][safeKey(nome)] = {avenca, meses:[12], datas:{}}
let processed={};         // honExtrato/processed — tx já importadas (evita duplicar)
let aliases={};           // honExtrato/aliases[safeKey(nome)] = [texto,...]
let staged=[];            // transações carregadas do ficheiro, prontas para revisão

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800);
}

/* ================= NORMALIZAÇÃO / PARSING ================= */
function stripAccents(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function normalize(s){
  return stripAccents((s||'').toUpperCase()).replace(/[.,\-\/]/g,' ').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
const PREFIX_PATTERNS = [
  /^TRF\s*CRED\s*INTRABANC\s*DE\s*/i,
  /^TRF\s*CRED\s*SEPA\+?\s*DE\s*/i,
  /^TRF\.?\s*IMED\.?\s*DE\s*/i,
  /^TRF\.?\s*A\s*CRED\.?\s*SEPA\+?\s*DE?\s*/i,
  /^TRF\s*DE\s*/i,
  /^PAGAMENTO\s*FATURA\s*/i,
  /^PAG\s*FT\s*/i,
  /^PAG\s+/i,
];
const MONTH_NAMES=['JANEIRO','FEVEREIRO','MARCO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const MONTH_RE = new RegExp('('+MONTH_NAMES.join('|')+')\\s*-?\\s*(\\d{4})','i');

function parseDescription(raw){
  let desc=(raw||'').trim();
  let explicito=null;
  const normDesc=stripAccents(desc.toUpperCase());
  const mm=normDesc.match(MONTH_RE);
  if(mm){
    const idx=MONTH_NAMES.indexOf(mm[1].toUpperCase());
    if(idx>=0) explicito={ano:mm[2], mi:idx};
  }
  let stripped=desc;
  for(const p of PREFIX_PATTERNS){ if(p.test(stripped)){ stripped=stripped.replace(p,''); break; } }
  stripped=stripped.replace(/-\s*R?\d{5,}\s*$/i,'').replace(/\s{2,}/g,' ').trim();
  return {clean:stripped, explicito};
}

function wordSet(s){ return new Set(normalize(s).split(' ').filter(w=>w.length>1)); }
function diceScore(a,b){
  const A=wordSet(a), B=wordSet(b);
  if(A.size===0||B.size===0) return 0;
  let inter=0; for(const w of A) if(B.has(w)) inter++;
  return (2*inter)/(A.size+B.size);
}
function substringBonus(a,b){
  const na=normalize(a), nb=normalize(b);
  if(!na||!nb) return 0;
  if(na.includes(nb)||nb.includes(na)) return 0.25;
  return 0;
}
function findBestClientMatch(cleanDesc, clientKey){
  let best=null, bestScore=0;
  for(const c of clientes){
    const names=[c.nome, ...(aliases[safeKey(c.nome)]||[])];
    for(const n of names){
      const score=diceScore(cleanDesc,n)+substringBonus(cleanDesc,n);
      if(score>bestScore){ bestScore=score; best=c; }
    }
  }
  return {client:best, score:bestScore};
}

/* ================= MESES / ANO-MI ================= */
function parseDateBR(dataStr){
  if(/^\d{2}-\d{2}-\d{4}$/.test(dataStr)){ const [d,m,y]=dataStr.split('-'); return new Date(+y,+m-1,+d); }
  return new Date(dataStr);
}
function anoMiFromDate(d){ return {ano:String(d.getFullYear()), mi:d.getMonth()}; }
function monthBefore({ano,mi}){ return mi===0 ? {ano:String(+ano-1), mi:11} : {ano, mi:mi-1}; }
function nextAnoMi({ano,mi}){ return mi===11 ? {ano:String(+ano+1), mi:0} : {ano, mi:mi+1}; }
function cmpAnoMi(a,b){ if(a.ano!==b.ano) return a.ano<b.ano?-1:1; return a.mi-b.mi; }
function referenceAnoMi(){ const now=new Date(); return monthBefore({ano:String(now.getFullYear()), mi:now.getMonth()}); }
function label(anoMi){ return MESES[anoMi.mi]+'/'+anoMi.ano.slice(2); }
function toISODate(dataStr){ const d=parseDateBR(dataStr); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function cellValue(nomeKey, anoMi){
  const arr = rec[anoMi.ano]?.[nomeKey]?.meses;
  return arr ? (arr[anoMi.mi]||null) : null;
}
function findStart(nomeKey){
  for(const ano of ANOS){
    const arr = rec[ano]?.[nomeKey]?.meses;
    if(!arr) continue;
    for(let mi=0; mi<12; mi++){ if(arr[mi]) return {ano, mi}; }
  }
  return null;
}
function pendingList(nomeKey, upTo){
  const start=findStart(nomeKey);
  if(!start) return [];
  const list=[];
  let cur={...start};
  while(cmpAnoMi(cur,upTo)<=0){
    if(!cellValue(nomeKey,cur)) list.push({...cur});
    cur=nextAnoMi(cur);
    if(+cur.ano>2031) break;
  }
  return list;
}

/* ================= ALOCAÇÃO ================= */
function allocate(tx, client){
  const nomeKey=safeKey(client.nome);
  const parsed=parseDescription(tx.desc);
  let alvos=[];

  if(parsed.explicito){
    alvos=[parsed.explicito];
  } else {
    const dataObj=parseDateBR(tx.data);
    const defaultCompet=monthBefore(anoMiFromDate(dataObj));
    const avenca=Number(client.avenca)||0;
    if(avenca>0){
      const n=Math.round(tx.montante/avenca);
      const diff=Math.abs(tx.montante-n*avenca)/avenca;
      if(n>=1 && diff<0.12){
        const pend=pendingList(nomeKey, defaultCompet);
        let startM = pend.length ? pend[0] : defaultCompet;
        alvos=[]; let cur={...startM};
        for(let i=0;i<n;i++){ alvos.push({...cur}); cur=nextAnoMi(cur); }
      }
    }
    if(alvos.length===0){
      const pend=pendingList(nomeKey, defaultCompet);
      alvos=[ pend.length ? pend[0] : defaultCompet ];
    }
  }

  return alvos.map(a=>({...a, conflito: !!cellValue(nomeKey,a)}));
}

/* ================= IMPORTAÇÃO DE FICHEIRO ================= */
function txId(dataStr,desc,montante){
  return 'tx_'+btoa(unescape(encodeURIComponent(dataStr+'|'+desc+'|'+montante))).replace(/[^A-Za-z0-9]/g,'').slice(0,24);
}

function handleFile(file){
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1,raw:false,defval:''});
      staged=[];
      let jaImportadas=0, ignoradas=0;
      for(let i=1;i<rows.length;i++){
        const r=rows[i];
        if(!r||r.length<3) continue;
        const dataStr=String(r[0]||'').trim();
        const desc=String(r[1]||'').trim();
        const montante=parseFloat(String(r[2]||'0').replace(',','.'));
        if(!dataStr||!desc||isNaN(montante)||montante<=0){ ignoradas++; continue; }
        const id=txId(dataStr,desc,montante);
        if(processed[id]){ jaImportadas++; continue; }
        const parsed=parseDescription(desc);
        const match=findBestClientMatch(parsed.clean);
        const tx={id, data:dataStr, desc, descLimpa:parsed.clean, montante,
                  clienteSugerido: (match.client && match.score>=0.5) ? match.client.nome : null,
                  clienteEscolhido: (match.client && match.score>=0.5) ? match.client.nome : '',
                  score: match.score, incluir: !!(match.client && match.score>=0.5),
                  alvos: [] };
        if(tx.clienteEscolhido) tx.alvos = allocate(tx, clientes.find(c=>c.nome===tx.clienteEscolhido));
        staged.push(tx);
      }
      toast(`${staged.length} movimento(s) novo(s) carregado(s) · ${jaImportadas} já importado(s) antes · ${ignoradas} linha(s) ignorada(s)`);
      render();
    }catch(err){ toast('Erro ao ler ficheiro: '+err.message); console.error(err); }
  };
  reader.readAsBinaryString(file);
}

function onClienteChange(id, nome){
  const tx=staged.find(t=>t.id===id);
  tx.clienteEscolhido=nome;
  tx.incluir=!!nome;
  tx.alvos = nome ? allocate(tx, clientes.find(c=>c.nome===nome)) : [];
  render();
}
function onToggleIncluir(id, val){
  const tx=staged.find(t=>t.id===id);
  tx.incluir=val;
}

/* ================= GRAVAÇÃO ================= */
async function ensureRecEntry(ano, nomeKey, client){
  if(!rec[ano]) rec[ano]={};
  if(!rec[ano][nomeKey]) rec[ano][nomeKey]={avenca:client.avenca||0, meses:Array(12).fill(null), datas:{}};
}
async function gravarTudo(){
  const aIncluir = staged.filter(t=>t.incluir && t.clienteEscolhido && t.alvos.some(a=>!a.conflito));
  if(aIncluir.length===0){ toast('Nada para gravar.'); return; }
  document.getElementById('btnGravar').disabled=true;
  document.getElementById('btnGravar').textContent='A gravar…';

  let totalCelulas=0;
  for(const tx of aIncluir){
    const client=clientes.find(c=>c.nome===tx.clienteEscolhido);
    const nomeKey=safeKey(client.nome);
    const dataISO=toISODate(tx.data);
    for(const alvo of tx.alvos){
      if(alvo.conflito) continue; // nunca sobrescrever
      await ensureRecEntry(alvo.ano, nomeKey, client);
      rec[alvo.ano][nomeKey].meses[alvo.mi]='Transferência';
      rec[alvo.ano][nomeKey].datas[alvo.mi]=dataISO;
      await fbSet(`/rec/${alvo.ano}/${nomeKey}/meses/${alvo.mi}`, 'Transferência');
      await fbSet(`/rec/${alvo.ano}/${nomeKey}/datas/${alvo.mi}`, dataISO);
      totalCelulas++;
    }
    // aprender alias
    const key=safeKey(client.nome);
    if(!aliases[key]) aliases[key]=[];
    if(tx.descLimpa && normalize(tx.descLimpa)!==normalize(client.nome) && !aliases[key].includes(tx.descLimpa)){
      aliases[key].push(tx.descLimpa);
      await fbSet(`/honExtrato/aliases/${key}`, aliases[key]);
    }
    // marcar como processada
    processed[tx.id]={data:tx.data, desc:tx.desc, montante:tx.montante, cliente:client.nome};
    await fbSet(`/honExtrato/processed/${tx.id}`, processed[tx.id]);
  }
  staged = staged.filter(t=>!aIncluir.includes(t));
  toast(`Gravado: ${aIncluir.length} movimento(s), ${totalCelulas} mês(es) marcado(s) como recebido.`);
  document.getElementById('btnGravar').disabled=false;
  document.getElementById('btnGravar').textContent='✓ Confirmar e dar baixa';
  render();
}

/* ================= RENDER ================= */
function render(){
  const main=document.getElementById('main');
  if(!unlocked){ renderLogin(main); return; }
  main.innerHTML='';

  const cardImport=document.createElement('div');
  cardImport.className='card';
  cardImport.innerHTML=`
    <h2>1. Importar extrato (.xls / .xlsx)</h2>
    <div class="sub">Exporte o extrato do banco (Data valor, Descrição da Conta, Montante, Moeda) e carregue aqui. Movimentos já importados anteriormente não são repetidos.</div>
    <div class="row">
      <input type="file" id="fileInput" accept=".xls,.xlsx">
      <button class="btn gold" onclick="handleFile(document.getElementById('fileInput').files[0])">Carregar</button>
    </div>
  `;
  main.appendChild(cardImport);

  if(staged.length===0){
    main.innerHTML += `<div class="card"><div class="empty">Sem movimentos carregados. Escolha um ficheiro acima.</div></div>`;
    return;
  }

  const cardRev=document.createElement('div');
  cardRev.className='card';
  const nConflitos = staged.filter(t=>t.alvos.some(a=>a.conflito)).length;
  cardRev.innerHTML=`
    <h2>2. Rever antes de gravar</h2>
    <div class="sub">${staged.length} movimento(s) por rever. Corrija o cliente se a sugestão estiver errada.
    ${nConflitos>0?` <b style="color:var(--red)">${nConflitos} com mês já preenchido — não serão sobrescritos.</b>`:''}</div>
  `;
  const table=document.createElement('table');
  table.innerHTML=`<thead><tr><th>Data</th><th>Descrição</th><th>Valor</th><th>Cliente</th><th>Competência</th><th>Incluir</th></tr></thead>`;
  const tbody=document.createElement('tbody');
  staged.forEach(tx=>{
    const tr=document.createElement('tr');
    const opts = clientes.map(c=>`<option value="${escapeAttr(c.nome)}" ${tx.clienteEscolhido===c.nome?'selected':''}>${escapeHtml(c.nome)}</option>`).join('');
    const mesesHtml = tx.alvos.map(a=>`<span class="month-badge${a.conflito?' conflict':''}">${label(a)}${a.conflito?' ⚠':''}</span>`).join('') || '<span class="muted">—</span>';
    tr.innerHTML=`
      <td>${tx.data}</td>
      <td>${escapeHtml(tx.desc)}</td>
      <td>€ ${tx.montante.toFixed(2)}</td>
      <td><select onchange="onClienteChange('${tx.id}', this.value)" style="min-width:210px">
            <option value="">— sem cliente —</option>${opts}
          </select>
          ${tx.clienteEscolhido && !tx.clienteSugerido ? '<div class="tag warn">manual</div>' : (tx.clienteEscolhido ? '<div class="tag ok">'+Math.round(tx.score*100)+'%</div>' : '<div class="tag bad">sem sugestão</div>')}
      </td>
      <td>${mesesHtml}</td>
      <td style="text-align:center"><input type="checkbox" ${tx.incluir?'checked':''} onchange="onToggleIncluir('${tx.id}', this.checked)"></td>
    `;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  cardRev.appendChild(table);
  cardRev.innerHTML += `<div class="row" style="margin-top:14px"><button class="btn gold" id="btnGravar" onclick="gravarTudo()">✓ Confirmar e dar baixa</button></div>`;
  main.appendChild(cardRev);
}

function renderLogin(main){
  main.innerHTML=`
    <div class="locked-box">
      <div style="font-size:28px;margin-bottom:8px">🔒</div>
      <p style="color:var(--muted);font-size:13px">Módulo de acesso restrito (admin).</p>
      <input type="password" id="loginPass" placeholder="Senha de administrador" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn gold" style="width:100%" onclick="doLogin()">Entrar</button>
      <div id="loginErr" style="color:var(--red);font-size:12px;margin-top:8px"></div>
    </div>
  `;
}
function doLogin(){
  const p=document.getElementById('loginPass').value;
  if(p===PASS_ADMIN){ unlocked=true; carregarDados(); }
  else document.getElementById('loginErr').textContent='Senha incorreta.';
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ================= ARRANQUE ================= */
async function carregarDados(){
  render(); // mostra ecrã vazio autenticado enquanto carrega
  const [meta, recData, proc, ali] = await Promise.all([
    fbGet('/meta'), fbGet('/rec'), fbGet('/honExtrato/processed'), fbGet('/honExtrato/aliases')
  ]);
  setFB(meta!==null || recData!==null);
  clientes = meta && meta.clientes ? (Array.isArray(meta.clientes)?meta.clientes:Object.values(meta.clientes)) : [];
  rec = recData || {};
  processed = proc || {};
  aliases = ali || {};
  render();
}
carregarDados();
</script>
</body>
</html>
