<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dafilgest — Declarações Fiscais</title>
<style>
:root {
  --azul: #1a3a5c;
  --azul2: #2255a4;
  --ouro: #c8a84b;
  --ouro2: #e8c96a;
  --verde: #1a7a3c;
  --verde2: #27ae60;
  --vermelho: #c0392b;
  --laranja: #e67e22;
  --cinza: #6c757d;
  --fundo: #f0f4f8;
  --branco: #ffffff;
  --borda: #d0d8e4;
  --texto: #1a2535;
  --texto2: #4a5568;
  --sombra: 0 2px 12px rgba(26,58,92,0.10);
  --sombra2: 0 4px 24px rgba(26,58,92,0.16);
  --radius: 10px;
  --radius2: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--fundo); color: var(--texto); font-size: 14px; }

/* LOGIN */
#login-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a3a5c 0%, #2255a4 60%, #1a3a5c 100%);
}
.login-card {
  background: var(--branco); border-radius: 16px; padding: 48px 40px 40px;
  width: 100%; max-width: 380px; box-shadow: var(--sombra2);
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.login-logo { font-size: 2.2rem; font-weight: 800; color: var(--azul); letter-spacing: -1px; }
.login-logo span { color: var(--ouro); }
.login-sub { font-size: 0.82rem; color: var(--cinza); margin-top: 4px; text-align: center; margin-bottom: 28px; }
.login-card input {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--borda); border-radius: var(--radius2);
  font-size: 15px; margin-bottom: 12px; outline: none; transition: border 0.2s;
}
.login-card input:focus { border-color: var(--azul2); }
.btn-login {
  width: 100%; padding: 12px; background: var(--azul); color: #fff; border: none;
  border-radius: var(--radius2); font-size: 15px; font-weight: 700; cursor: pointer;
  margin-top: 4px; transition: background 0.2s;
}
.btn-login:hover { background: var(--azul2); }
.login-error { color: var(--vermelho); font-size: 0.82rem; margin-top: 6px; display: none; }

/* HEADER */
#app { display: none; }
header {
  background: var(--azul); color: #fff; padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; position: sticky; top: 0; z-index: 100; box-shadow: var(--sombra2);
}
.header-logo { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px; }
.header-logo span { color: var(--ouro2); }
.header-right { display: flex; align-items: center; gap: 16px; }
.header-ano {
  background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.25);
  color: #fff; border-radius: var(--radius2); padding: 5px 12px; font-size: 14px; font-weight: 700; cursor: pointer;
}
.header-user { font-size: 0.8rem; color: rgba(255,255,255,0.7); }
.btn-sair {
  background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.25);
  color: #fff; border-radius: var(--radius2); padding: 5px 12px; font-size: 13px; cursor: pointer;
  transition: background 0.2s;
}
.btn-sair:hover { background: rgba(255,255,255,0.22); }

/* TABS */
.tabs {
  background: var(--branco); border-bottom: 2px solid var(--borda);
  display: flex; padding: 0 24px; gap: 4px;
}
.tab {
  padding: 14px 20px; cursor: pointer; font-weight: 600; color: var(--cinza);
  border-bottom: 3px solid transparent; margin-bottom: -2px; font-size: 13.5px;
  transition: color 0.2s, border-color 0.2s; white-space: nowrap;
}
.tab:hover { color: var(--azul2); }
.tab.active { color: var(--azul); border-bottom-color: var(--ouro); }

/* MAIN */
main { padding: 24px; max-width: 1400px; margin: 0 auto; }

/* DASHBOARD */
.dash-prazo {
  background: var(--azul); color: #fff; border-radius: var(--radius); padding: 16px 24px;
  margin-bottom: 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
}
.dash-prazo-item { display: flex; flex-direction: column; }
.dash-prazo-item .label { font-size: 0.72rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; }
.dash-prazo-item .val { font-size: 1.1rem; font-weight: 700; }
.dash-prazo-item .val.alerta { color: var(--ouro2); }
.dash-prazo-sep { width: 1px; background: rgba(255,255,255,0.2); height: 36px; }

.cards-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px; margin-bottom: 24px;
}
.card {
  background: var(--branco); border-radius: var(--radius); padding: 20px 22px;
  box-shadow: var(--sombra); border-left: 4px solid var(--borda);
}
.card.verde { border-left-color: var(--verde2); }
.card.azul { border-left-color: var(--azul2); }
.card.laranja { border-left-color: var(--laranja); }
.card.vermelho { border-left-color: var(--vermelho); }
.card.cinza { border-left-color: var(--cinza); }
.card .card-label { font-size: 0.75rem; color: var(--cinza); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.card .card-val { font-size: 2rem; font-weight: 800; color: var(--azul); }
.card .card-sub { font-size: 0.75rem; color: var(--cinza); margin-top: 2px; }

.alertas-box {
  background: #fff8e1; border: 1.5px solid #f59e0b; border-radius: var(--radius);
  padding: 16px 20px; margin-bottom: 20px;
}
.alertas-box h3 { color: #b45309; font-size: 0.85rem; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.alerta-item { font-size: 0.82rem; color: var(--texto); padding: 4px 0; border-bottom: 1px solid #fde68a; }
.alerta-item:last-child { border-bottom: none; }

/* TABELA */
.toolbar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
}
.toolbar input[type=text] {
  padding: 8px 14px; border: 1.5px solid var(--borda); border-radius: var(--radius2);
  font-size: 13.5px; min-width: 220px; outline: none; transition: border 0.2s;
}
.toolbar input[type=text]:focus { border-color: var(--azul2); }
.toolbar select {
  padding: 8px 12px; border: 1.5px solid var(--borda); border-radius: var(--radius2);
  font-size: 13.5px; background: #fff; cursor: pointer; outline: none;
}
.btn {
  padding: 8px 16px; border: none; border-radius: var(--radius2); font-size: 13.5px;
  font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--azul); color: #fff; }
.btn-primary:hover { background: var(--azul2); }
.btn-success { background: var(--verde2); color: #fff; }
.btn-success:hover { background: #219a52; }
.btn-warn { background: var(--laranja); color: #fff; }
.btn-warn:hover { background: #cf6d17; }
.btn-danger { background: var(--vermelho); color: #fff; }
.btn-danger:hover { background: #a93226; }
.btn-ghost { background: transparent; border: 1.5px solid var(--borda); color: var(--texto2); }
.btn-ghost:hover { background: var(--fundo); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-ouro { background: var(--ouro); color: #1a2535; }
.btn-ouro:hover { background: var(--ouro2); }

.table-wrap { overflow-x: auto; background: var(--branco); border-radius: var(--radius); box-shadow: var(--sombra); }
table { width: 100%; border-collapse: collapse; }
thead th {
  background: var(--azul); color: #fff; padding: 11px 14px;
  text-align: left; font-size: 12px; font-weight: 700; letter-spacing: 0.3px;
  white-space: nowrap;
}
thead th:first-child { border-radius: var(--radius) 0 0 0; }
thead th:last-child { border-radius: 0 var(--radius) 0 0; }
tbody tr { border-bottom: 1px solid var(--borda); transition: background 0.15s; }
tbody tr:hover { background: #f0f6ff; }
tbody td { padding: 10px 14px; font-size: 13px; vertical-align: middle; }
tbody td.nome { font-weight: 600; max-width: 260px; }
tbody td.nome small { display: block; color: var(--cinza); font-weight: 400; font-size: 11px; }
tfoot td { background: var(--fundo); padding: 10px 14px; font-weight: 700; font-size: 13px; border-top: 2px solid var(--borda); }

/* BADGE FASE */
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700; white-space: nowrap;
}
.badge-pendente { background: #e2e8f0; color: #4a5568; }
.badge-processo { background: #dbeafe; color: #1e40af; }
.badge-pronto { background: #fef3c7; color: #92400e; }
.badge-enviado { background: #d1fae5; color: #065f46; }
.badge-validado { background: #d1fae5; color: #065f46; border: 1.5px solid #34d399; }
.badge-erro { background: #fee2e2; color: #991b1b; }
.badge-isento { background: #f3f4f6; color: #6b7280; font-style: italic; }
.badge-yes { background: #d1fae5; color: #065f46; }
.badge-no { background: #fee2e2; color: #991b1b; }
.badge-pend-ies { background: #fef3c7; color: #92400e; }

/* SENHA */
.senha-cell { font-family: monospace; font-size: 12px; color: var(--cinza); letter-spacing: 1px; cursor: pointer; }
.senha-cell:hover { color: var(--azul2); }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000;
  display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px;
  overflow-y: auto;
}
.modal {
  background: var(--branco); border-radius: 14px; width: 100%; max-width: 640px;
  box-shadow: var(--sombra2); animation: fadeIn 0.18s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px 16px; border-bottom: 1.5px solid var(--borda);
}
.modal-header h2 { font-size: 1.05rem; color: var(--azul); font-weight: 800; }
.modal-close { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--cinza); padding: 4px; line-height: 1; }
.modal-body { padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1.5px solid var(--borda); display: flex; gap: 10px; justify-content: flex-end; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid.full { grid-template-columns: 1fr; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.span2 { grid-column: 1 / -1; }
.form-group label { font-size: 0.78rem; font-weight: 700; color: var(--cinza); text-transform: uppercase; letter-spacing: 0.4px; }
.form-group input, .form-group select, .form-group textarea {
  padding: 9px 12px; border: 1.5px solid var(--borda); border-radius: var(--radius2);
  font-size: 13.5px; outline: none; transition: border 0.2s; background: #fff;
  font-family: inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--azul2); }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-section { font-size: 0.78rem; font-weight: 800; color: var(--azul); text-transform: uppercase;
  letter-spacing: 0.8px; padding: 10px 0 6px; grid-column: 1 / -1; border-bottom: 1.5px solid var(--borda); margin-bottom: 4px; }

/* SEMAFORO */
.semaforo { display: flex; align-items: center; gap: 6px; }
.sem-dot { width: 10px; height: 10px; border-radius: 50%; }
.sem-verde { background: var(--verde2); }
.sem-amarelo { background: #f59e0b; }
.sem-vermelho { background: var(--vermelho); }
.sem-cinza { background: var(--cinza); }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--azul); color: #fff;
  padding: 12px 22px; border-radius: var(--radius); font-weight: 600; font-size: 14px;
  box-shadow: var(--sombra2); z-index: 9999; animation: slideIn 0.25s ease;
  display: none;
}
.toast.success { background: var(--verde2); }
.toast.error { background: var(--vermelho); }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

/* EMPRESAS */
.empresa-card {
  background: var(--branco); border-radius: var(--radius); padding: 16px 20px;
  box-shadow: var(--sombra); margin-bottom: 10px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.empresa-card.arquivado { opacity: 0.5; }
.empresa-nif { font-family: monospace; font-size: 12px; color: var(--cinza); }
.empresa-senha { font-family: monospace; font-size: 12px; background: var(--fundo); padding: 2px 8px; border-radius: 4px; cursor: pointer; }
.empresa-actions { margin-left: auto; display: flex; gap: 8px; }

/* EMPTY */
.empty { text-align: center; padding: 48px 20px; color: var(--cinza); }
.empty .icon { font-size: 3rem; margin-bottom: 12px; }

/* RESPONSIVE */
@media (max-width: 700px) {
  main { padding: 12px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-group.span2 { grid-column: 1; }
  header { padding: 0 12px; }
  .tabs { padding: 0 8px; }
  .tab { padding: 12px 10px; font-size: 12px; }
}

.ano-badge {
  display: inline-block; background: var(--ouro); color: #1a2535;
  border-radius: 6px; padding: 2px 10px; font-weight: 800; font-size: 15px; margin-left: 8px;
}
.resultado-positivo { color: var(--verde2); font-weight: 700; }
.resultado-negativo { color: var(--vermelho); font-weight: 700; }
.resultado-neutro { color: var(--cinza); }
.valor-pos { color: var(--vermelho); font-weight: 600; } /* A pagar */
.valor-neg { color: var(--verde2); font-weight: 600; } /* A receber */
.sem-senha { color: #f59e0b; font-size: 11px; font-weight: 700; }

.progress-bar-outer { background: #e2e8f0; border-radius: 20px; height: 8px; flex: 1; }
.progress-bar-inner { height: 100%; border-radius: 20px; background: var(--verde2); transition: width 0.4s; }
.progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.progress-label { width: 90px; font-size: 12px; color: var(--cinza); }
.progress-count { font-size: 12px; font-weight: 700; color: var(--azul); min-width: 40px; text-align: right; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Dafil<span>gest</span></div>
    <div class="login-sub">Gestão de Declarações Fiscais<br>NIF 505403447 · Vizela</div>
    <input type="password" id="login-senha" placeholder="Palavra-passe" autocomplete="current-password">
    <button class="btn-login" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error">Palavra-passe incorrecta.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-logo">Dafil<span>gest</span> <span style="font-weight:400;opacity:0.7;font-size:0.85rem">· Declarações Fiscais</span></div>
    <div class="header-right">
      <select class="header-ano" id="ano-select" onchange="mudarAno()"></select>
      <span class="header-user" id="header-user"></span>
      <button class="btn-sair" onclick="logout()">Sair</button>
    </div>
  </header>
  <div class="tabs">
    <div class="tab active" onclick="showTab('dashboard')">📊 Dashboard</div>
    <div class="tab" onclick="showTab('mod22')">📋 Mod. 22 IRC</div>
    <div class="tab" onclick="showTab('ies')">📑 IES</div>
    <div class="tab" onclick="showTab('empresas')" id="tab-empresas">🏢 Empresas</div>
  </div>
  <main id="main-content"></main>
</div>

<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" style="display:none" onclick="closeModalClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modal-title">Modal</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script type="module">
// ===================== FIREBASE =====================
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, get, update, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyBa_xVkswVw3KNdM_lPwJ4YwyyJmvEBGrc",
  authDomain: "dafilgest-declaracoes.firebaseapp.com",
  databaseURL: "https://dafilgest-declaracoes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dafilgest-declaracoes",
  storageBucket: "dafilgest-declaracoes.appspot.com",
  messagingSenderId: "626852328164",
  appId: "1:626852328164:web:fb1848042e65300ee732f1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===================== AUTH =====================
const SENHAS = {
  admin: 'Dafilgest2026*',
  leitura: 'Dafilgest2026'
};
let userRole = null;
let anoActivo = String(new Date().getFullYear() - 1); // default: ano anterior
let empresasCache = {};
let mod22Cache = {};
let iesCache = {};

window.doLogin = function() {
  const s = document.getElementById('login-senha').value;
  if (s === SENHAS.admin) { userRole = 'admin'; iniciarApp(); }
  else if (s === SENHAS.leitura) { userRole = 'leitura'; iniciarApp(); }
  else { document.getElementById('login-error').style.display = 'block'; }
};
document.getElementById('login-senha').addEventListener('keydown', e => { if (e.key === 'Enter') window.doLogin(); });

window.logout = function() {
  userRole = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-senha').value = '';
};

// ===================== INICIAR =====================
function iniciarApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('header-user').textContent = userRole === 'admin' ? '👤 Admin' : '👁 Leitura';
  if (userRole !== 'admin') document.getElementById('tab-empresas').style.display = 'none';
  popularAnos();
  carregarDados();
}

function popularAnos() {
  const sel = document.getElementById('ano-select');
  sel.innerHTML = '';
  const anos = ['2023','2024','2025','2026'];
  anos.forEach(a => {
    const op = document.createElement('option');
    op.value = a; op.textContent = a;
    if (a === anoActivo) op.selected = true;
    sel.appendChild(op);
  });
}

window.mudarAno = function() {
  anoActivo = document.getElementById('ano-select').value;
  carregarDados();
};

// ===================== DADOS =====================
function carregarDados() {
  // Empresas (globais, sem ano)
  onValue(ref(db, 'empresas'), snap => {
    empresasCache = snap.val() || {};
    // Se ainda não há empresas, importar do seed
    if (Object.keys(empresasCache).length === 0 && userRole === 'admin') {
      importarEmpresas();
    }
    // Carregar mod22 e ies do ano activo
    onValue(ref(db, `anos/${anoActivo}/mod22`), s2 => {
      mod22Cache = s2.val() || {};
      onValue(ref(db, `anos/${anoActivo}/ies`), s3 => {
        iesCache = s3.val() || {};
        renderTab(tabActiva());
      }, { onlyOnce: true });
    }, { onlyOnce: true });
  }, { onlyOnce: true });
}

function tabActiva() {
  const tabs = document.querySelectorAll('.tab');
  const labels = ['dashboard','mod22','ies','empresas'];
  for (let i=0; i<tabs.length; i++) {
    if (tabs[i].classList.contains('active')) return labels[i];
  }
  return 'dashboard';
}

// ===================== SEED EMPRESAS =====================
async function importarEmpresas() {
  const seed = EMPRESAS_SEED;
  const updates = {};
  seed.forEach(e => {
    updates[`empresas/${e.nif}`] = {
      id: e.id, nome: e.nome, nif: e.nif, senhaAT: e.senhaAT, arquivado: false, criadoEm: Date.now()
    };
  });
  await update(ref(db), updates);
  toast('68 empresas importadas com sucesso!', 'success');
  carregarDados();
}

// ===================== TABS =====================
window.showTab = function(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['dashboard','mod22','ies','empresas'][i] === tab);
  });
  renderTab(tab);
};

function renderTab(tab) {
  const main = document.getElementById('main-content');
  if (tab === 'dashboard') main.innerHTML = renderDashboard();
  else if (tab === 'mod22') main.innerHTML = renderMod22();
  else if (tab === 'ies') main.innerHTML = renderIES();
  else if (tab === 'empresas') main.innerHTML = renderEmpresas();
  afterRender(tab);
}

// ===================== DASHBOARD =====================
function renderDashboard() {
  const empresas = Object.values(empresasCache).filter(e => !e.arquivado);
  const total = empresas.length;

  // MOD 22 stats
  const m22 = Object.values(mod22Cache);
  const m22pend = empresas.filter(e => !mod22Cache[e.nif] || mod22Cache[e.nif].fase === 'pendente').length;
  const m22proc = empresas.filter(e => mod22Cache[e.nif]?.fase === 'processo').length;
  const m22pronto = empresas.filter(e => mod22Cache[e.nif]?.fase === 'pronto').length;
  const m22env = empresas.filter(e => mod22Cache[e.nif]?.fase === 'enviado').length;
  const m22valid = empresas.filter(e => mod22Cache[e.nif]?.fase === 'validado').length;
  const m22erro = empresas.filter(e => mod22Cache[e.nif]?.fase === 'erro').length;

window.guardarMod22 = async function(nif) {
  const dados = {
    fase: document.getElementById('m22-fase').value,
    resultado: document.getElementById('m22-resultado').value,
    valor: document.getElementById('m22-valor').value,
    metodoPag: document.getElementById('m22-metodo').value,
    dataEnvio: document.getElementById('m22-dataenvio').value,
    dataValidacao: document.getElementById('m22-datavalid').value,
    dataPag: document.getElementById('m22-datapag').value,
    iesAssoc: document.getElementById('m22-ies-flag').value,
    obs: document.getElementById('m22-obs').value,
    actualizadoEm: Date.now()
  };
  // Manter PDF existente
  if (mod22Cache[nif]?.pdfMod22) dados.pdfMod22 = mod22Cache[nif].pdfMod22;
  // Novo PDF
  const fileInput = document.getElementById('m22-pdf');
  if (fileInput && fileInput.files.length > 0) {
    const file = fileInput.files[0];
    if (file.size > 1.5 * 1024 * 1024) { toast('PDF demasiado grande (máx. 1.5MB)!', 'error'); return; }
    dados.pdfMod22 = await lerFicheiroBase64(file);
    dados.pdfMod22Nome = file.name;
    dados.pdfMod22Data = new Date().toLocaleDateString('pt-PT');
  }
  await set(ref(db, `anos/${anoActivo}/mod22/${nif}`), dados);
  mod22Cache[nif] = dados;
  closeModal();
  showTab('mod22');
  toast('Mod. 22 guardado!' + (fileInput?.files.length > 0 ? ' PDF arquivado ✅' : ''), 'success');
};

window.guardarIES = async function(nif) {
  const dados = {
    fase: document.getElementById('ies-fase').value,
    dataEnvio: document.getElementById('ies-dataenvio').value,
    dataValidacao: document.getElementById('ies-datavalid').value,
    mod22Assoc: document.getElementById('ies-mod22').value,
    contabAnex: document.getElementById('ies-contab').value,
    despacho: document.getElementById('ies-despacho').value,
    obs: document.getElementById('ies-obs').value,
    actualizadoEm: Date.now()
  };
  // Manter PDF existente
  if (iesCache[nif]?.pdfIES) dados.pdfIES = iesCache[nif].pdfIES;
  // Novo PDF
  const fileInput = document.getElementById('ies-pdf');
  if (fileInput && fileInput.files.length > 0) {
    const file = fileInput.files[0];
    if (file.size > 2.5 * 1024 * 1024) { toast('PDF demasiado grande (máx. 2.5MB)!', 'error'); return; }
    dados.pdfIES = await lerFicheiroBase64(file);
    dados.pdfIESNome = file.name;
    dados.pdfIESData = new Date().toLocaleDateString('pt-PT');
  }
  await set(ref(db, `anos/${anoActivo}/ies/${nif}`), dados);
  iesCache[nif] = dados;
  closeModal();
  showTab('ies');
  toast('IES guardada!' + (fileInput?.files.length > 0 ? ' PDF arquivado ✅' : ''), 'success');
};

window.exportarExcelMod22 = function() {
  const empresas = Object.values(empresasCache).filter(e => !e.arquivado).sort((a,b) => a.nome.localeCompare(b.nome));
  let csv = 'Nº;Empresa;NIF;Fase;Data Envio;Data Validação;Resultado;Valor (€);Método Pag.;Data Pag.;IES;Observações\n';
  empresas.forEach((e,i) => {
    const m = mod22Cache[e.nif] || {};
    const ies = iesCache[e.nif] || {};
    csv += `${i+1};"${e.nome}";${e.nif};${faseLbl(m.fase||'pendente')};${m.dataEnvio||''};${m.dataValidacao||''};${m.resultado||''};${m.valor||''};${m.metodoPag||''};${m.dataPag||''};${faseLbl(ies.fase||'pendente')};"${m.obs||''}"\n`;
  });
  downloadCSV(csv, `Mod22_IRC_${anoActivo}.csv`);
};

window.exportarExcelIES = function() {
  const empresas = Object.values(empresasCache).filter(e => !e.arquivado).sort((a,b) => a.nome.localeCompare(b.nome));
  let csv = 'Nº;Empresa;NIF;Fase;Data Envio;Data Validação;Mod.22 Assoc.;Contab. Anex.;Despacho;Observações\n';
  empresas.forEach((e,i) => {
    const d = iesCache[e.nif] || {};
    csv += `${i+1};"${e.nome}";${e.nif};${faseLbl(d.fase||'pendente')};${d.dataEnvio||''};${d.dataValidacao||''};${d.mod22Assoc==='sim'?'Sim':'Não'};${d.contabAnex==='sim'?'Sim':'Não'};${d.despacho||''};"${d.obs||''}"\n`;
  });
  downloadCSV(csv, `IES_${anoActivo}.csv`);
};

function downloadCSV(csv, filename) {
  const bom = '\uFEFF';
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  a.click(); URL.revokeObjectURL(url);
  toast('Exportação concluída!', 'success');
}

// ===================== PDF HELPERS =====================
function lerFicheiroBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

window.verPDF = function(tipo, nif) {
  const cache = tipo === 'mod22' ? mod22Cache : iesCache;
  const campo = tipo === 'mod22' ? 'pdfMod22' : 'pdfIES';
  const d = cache[nif];
  if (!d || !d[campo]) { toast('PDF não encontrado!', 'error'); return; }
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>${d[campo+'Nome']||'Declaração'}</title></head><body style="margin:0"><embed src="${d[campo]}" type="application/pdf" width="100%" height="100%"></body></html>`);
};

window.apagarPDF = async function(tipo, nif) {
  if (!confirm('Remover PDF arquivado?')) return;
  const path = tipo === 'mod22' ? `anos/${anoActivo}/mod22/${nif}` : `anos/${anoActivo}/ies/${nif}`;
  const cache = tipo === 'mod22' ? mod22Cache : iesCache;
  const campo = tipo === 'mod22' ? 'pdfMod22' : 'pdfIES';
  const dadosAtuais = {...cache[nif]};
  delete dadosAtuais[campo];
  delete dadosAtuais[campo+'Nome'];
  delete dadosAtuais[campo+'Data'];
  await set(ref(db, path), dadosAtuais);
  cache[nif] = dadosAtuais;
  closeModal();
  toast('PDF removido.', 'success');
};

// ===================== HELPERS =====================
function faseLbl(f) {
  const m = { pendente:'Pendente', processo:'Em Processo', pronto:'Pronto', enviado:'Enviado AT', validado:'Validado AT', erro:'Erro AT', isento:'Isento' };
  return m[f] || f;
}
function resultadoLbl(r) {
  const m = { pagar:'A Pagar', receber:'A Receber', zero:'Zero' };
  return m[r] || r;
}
function formatEur(v, resultado) {
  const n = parseFloat(v);
  if (isNaN(n)) return '—';
  const f = n.toLocaleString('pt-PT', {style:'currency',currency:'EUR'});
  if (resultado === 'pagar') return `<span class="valor-pos">${f}</span>`;
  if (resultado === 'receber') return `<span class="valor-neg">${f}</span>`;
  return f;
}
